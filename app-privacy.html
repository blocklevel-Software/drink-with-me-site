**Stand: 26. November 2026**

Diese Datenschutzerklärung erläutert, wie personenbezogene Daten bei der Nutzung der mobilen Anwendung **Drink With Me** („die App“, „wir“, „uns“) verarbeitet werden. Für die Website gibt es eine eigene Datenschutzerklärung.

## 1. Verantwortlicher
**blocklevel GmbH**, Drahtzieherweg 15, 47877 Willich, Deutschland

E-Mail: **datenschutz@blocklevel.de** · Telefon: +49 (2154) 8912 - 800

## 2. Alter
Die App ist nur für Personen ab 18 Jahren. Dein Geburtsdatum wird bei der Registrierung geprüft; wer jünger als 18 ist, kann kein Konto anlegen.

## 3. Welche Daten wir verarbeiten

### Konto und Anmeldung
- E-Mail-Adresse, Benutzer-Kennung und die Art der Anmeldung (E-Mail mit Einmalcode, Apple oder Google).
- Die Anmeldung läuft über **Microsoft Entra External ID**. Bei Apple oder Google authentifiziert dich der jeweilige Anbieter und übermittelt uns die Angaben, die für dein Konto nötig sind. Apple-Adressen mit „E-Mail verbergen“ behandeln wir als eigene Adresse.
- Pro E-Mail-Adresse gibt es ein Konto. Meldest du dich mit einer zweiten Anmeldeart und derselben Adresse an, verknüpfen wir die Konten nicht und weisen dich auf die erste Anmeldeart hin.
- Mit der Registrierung bestätigst du die Nutzungsbedingungen; wir speichern die akzeptierte Version.

### Profil
Vorname, Geburtsdatum (angezeigt wird dein Alter), bis zu drei Profilfotos, eine Kurzbeschreibung (bis 140 Zeichen), Sprachen, deine Stadt sowie deine Einstellungen (wofür du offen bist, Getränke, Orte, Privatsphäre, Benachrichtigungen). Dein Profil sehen andere Personen im Rahmen der Funktionen der App. Von deinen Fotos speichern wir nur neu kodierte Versionen ohne Metadaten (z. B. Aufnahmeort); die Datei, die du hochlädst, behalten wir nicht.

### Standort
- Mit deiner Erlaubnis („Beim Verwenden der App“) lesen wir deinen ungefähren Standort, um Check-ins, Runden und Treffpunkte in deiner Nähe anzuzeigen, deine Gegend (z. B. Stadtteil) zu bestimmen und dir „Sag mir Bescheid“-Hinweise zu schicken.
- **Fremde sehen nie deine Koordinaten, deine Bar oder eine Adresse**, sondern nur die Gegend und einen Kartenpunkt auf einem Raster von ca. 1,1 km. Freunde sehen die Bar deines Check-ins. Nach einem gegenseitigen Prost sehen sich beide die Bar im Chat.
- Um deine Gegend zu bestimmen und Bars zu suchen, übermittelt unser Server Koordinaten und Suchbegriffe an **Microsoft Azure Maps**.
- Wir speichern deine zuletzt bekannte Position, damit wir dich bei Aktivitäten in der Nähe benachrichtigen können (wenn du „Sag mir Bescheid“ eingeschaltet hast).
- **Standort im Chat teilen:** Wenn du im Chat „Aktuellen Standort teilen“ wählst, sehen die Chat-Mitglieder deinen genauen Standort einmalig als Zeile im Chat und können ihn eine Stunde lang in einer Karten-App öffnen. Danach entfernen wir die Koordinaten aus dem Chat. Der Standort wird nicht live aktualisiert; die App liest ihn nur in dem Moment, in dem du bestätigst.

### Check-ins, Runden und Treffpunkte
- **Check-in („Ich bin gerade unterwegs“):** Getränk, Bar oder Gegend, wer ihn sehen darf (Freunde, ausgewählte Freunde, alle), ob du allein bist, optional ein Drinkfoto und eine Notiz. Ein Check-in endet nach 3 Stunden (auf Wunsch +1 Stunde) oder wenn du ihn beendest. **Das Drinkfoto löschen wir, sobald der Check-in endet.**
- **Runden:** Zeit, Ort (Bar oder Umkreis), Getränk, Plätze, Stimmung, Notiz, Mitglieder, Anfragen und deine Antwort auf die Erinnerung am Tag der Runde.
- **Treffpunkte:** Wöchentliche Termine in Bars. Wir speichern, ob du „dabei“ bist.

### Prost, Dazukommen, Freunde
Prost und Gegen-Prost (unter Freunden auch ein Prost für eine geplante Runde; der Gastgeber sieht, welche Freunde zugeprostet haben), Dazukommen-Anfragen und -Antworten (mit geschätzter Ankunftszeit), Freundschaften (entstehen über einen Einladungslink oder nach einem Treffen mit beidseitigem „Ja, gern“) und Einladungslinks.

### Chats
Nachrichten (Text, Schnellaktionen wie „Bin unterwegs“ und „Bin da“, geteilter Standort), Zeitstempel und Lesestatus sowie Reaktionen (ein Emoji pro Person und Nachricht, für alle im Chat sichtbar). Unsere Systemzeilen im Chat (z. B. „Lena ist unterwegs“) zeigen nur, was die Beteiligten selbst ausgelöst haben.

### Nach dem Treffen
Einen Tag nach einem Treffen fragen wir „Wie war’s?“. Wir speichern deine Antwort (z. B. in Kontakt bleiben, „nicht getroffen“ mit Grund, „war nicht da“). **Eine einseitige Antwort erfährt die andere Person nie.** Befreundet werden zwei Personen nur, wenn beide „Ja, gern“ sagen. Wer in mehreren Treffen als nicht erschienen markiert wurde, dessen „erschienen“-Wert im Profil sinkt; einzelne Markierungen zählen nicht. Wählst du „Nicht okay“, legen wir eine Meldung an, die wir innerhalb von 24 Stunden prüfen.

### Selfie-Verifizierung
Die Selfie-Verifizierung ist **derzeit nicht aktiv**. Nimmst du dennoch in der App ein Selfie auf, empfängt unser Server es, wertet es nicht aus und speichert es nicht; gespeichert wird nur der Zeitpunkt deiner Einwilligung. Bevor wir die Verifizierung einschalten, ergänzen wir diese Erklärung.

### Sicherheit
Blockieren und Melden (meldende und gemeldete Person, Grund, betroffene Inhalte, Maßnahme). Wer blockiert ist, verschwindet in beide Richtungen aus Check-ins, Runden, Prost und Chats.

### Benachrichtigungen
Gerätekennung für Push (**Firebase Cloud Messaging** von Google bzw. **Apple Push Notification Service**), deine Einstellungen (Freunde unterwegs, Prost, Anfragen für deine Runde; Ruhezeiten) und Zustellversuche. Auf dem Sperrbildschirm zeigen wir nie die Bar und nennen bei „jemand prostet dir zu“ nicht den Absender. Antwortest du direkt aus einer Benachrichtigung auf „Dazukommen“, verwenden wir dafür ein einmaliges, nur für diese Anfrage gültiges Token.

### Technik, Absturzberichte
IP-Adresse, Zeitstempel, Gerätetyp, Betriebssystem, App-Version, Fehler- und Sicherheitsereignisse. In Release-Versionen nutzen wir **Firebase Crashlytics** (Crash-Berichte, Gerätemodell, Installationskennungen; Speicherung nach Angaben von Google ca. 90 Tage). **Firebase Analytics setzen wir nicht ein.** Zusätzlich senden wir technische Telemetrie an unsere eigene Infrastruktur, um Fehler zu erkennen und Missbrauch zu verhindern. Anfragen mit Schreibzugriff halten wir 30 Tage vor, um doppelte Ausführungen zu verhindern.

### Karten
Wir verwenden **MapLibre**. Die Kartenstile liefern wir über unsere Website drink-with-me.net aus (Hosting: **GitHub Pages** von GitHub, Inc., USA), die Kartenkacheln stammen von **OpenFreeMap** (Hyperknot Software Kft., Ungarn; ggf. mit Cloudflare als CDN) und Daten von OpenStreetMap. Beim Laden der Karte werden technisch notwendige Verbindungsdaten an GitHub und OpenFreeMap übertragen. Nach eigenen Angaben speichert OpenFreeMap keine IP-Adressen in regulären Protokollen; bei Missbrauch kann sie bis zu 30 Tage protokolliert werden.

## 4. Zwecke und Rechtsgrundlagen
- **Vertrag (Art. 6 Abs. 1 lit. b DSGVO):** Konto, Profil, Check-ins, Runden, Prost, Chats, Freunde, Treffpunkte, Benachrichtigungen, die du in der App nutzt.
- **Einwilligung (Art. 6 Abs. 1 lit. a DSGVO):** Standortfreigabe, Kamera, Mitteilungen, Teilen des Standorts im Chat.
- **Berechtigtes Interesse (Art. 6 Abs. 1 lit. f DSGVO):** Sicherheit und Stabilität, Absturzberichte, Missbrauchs- und Betrugsabwehr, Prüfung von Meldungen, Rate-Limits, Durchsetzung der Regeln.
- **Rechtliche Verpflichtung (Art. 6 Abs. 1 lit. c DSGVO)**, soweit zutreffend.
Wir treffen keine Entscheidungen, die dir gegenüber rechtliche Wirkung entfalten, allein automatisiert (Art. 22 DSGVO).

## 5. Zugriff auf dein Gerät
Kamera und Fotos (Profilfotos, Drinkfoto, Selfie), Standort („Beim Verwenden der App“, nie im Hintergrund), Mitteilungen und lokaler Speicher (Spracheinstellung, Erscheinungsbild, Zwischenstand der Registrierung) nur, soweit für die jeweilige Funktion nötig oder von dir erlaubt (§ 25 TDDDG). Berechtigungen kannst du jederzeit in den Einstellungen deines Betriebssystems widerrufen.

## 6. Empfänger und Dienstleister
- **Microsoft:** Azure (Hosting in der Region Nordeuropa), Entra External ID (Anmeldung), Azure Maps (Ortssuche und Bestimmung deiner Gegend).
- **Google:** Firebase Cloud Messaging, Firebase Crashlytics; Anmeldung mit Google.
- **Apple:** Push-Dienst; Anmeldung mit Apple.
- **GitHub:** Auslieferung der Kartenstile.
- **OpenFreeMap / Cloudflare:** Karten.
- **Andere Nutzer:** nur das, was die jeweilige Funktion vorsieht (Profil, Check-in, Gegend, Chats) und wie du es freigibst.
Wir verkaufen keine Daten und nutzen sie nicht für Werbung durch Dritte oder appübergreifendes Tracking.

## 7. Drittländer
Anbieter mit Sitz in den USA (Google, Apple, Microsoft, GitHub, Cloudflare) setzen wir auf Grundlage des EU-US Data Privacy Framework oder der Standardvertragsklauseln der Europäischen Kommission ein.

## 8. Speicherdauer
- **Drinkfoto:** wird gelöscht, sobald der Check-in endet.
- **Geteilter Standort im Chat:** eine Stunde abrufbar, danach werden die Koordinaten aus der Chatzeile entfernt.
- **Schreibzugriffs-Schlüssel (Idempotenz):** 30 Tage.
- **Absturzberichte:** ca. 90 Tage (Google).
- **Alles Übrige:** bis du dein Konto löschst. Beim Löschen entfernen wir dein Profil, deine Fotos, Check-ins, Runden-Teilnahmen, Chats, Prost, Treffen, Blockierungen, Meldungen, Geräte-Kennungen, Benachrichtigungen und dein Anmeldekonto.
Kontolöschung und Datenexport findest du in der App unter Einstellungen → Konto und unter [drink-with-me.net/delete-account.html](delete-account.html).

## 9. Deine Rechte
Auskunft, Berichtigung, Löschung, Einschränkung, Datenübertragbarkeit, Widerspruch gegen Verarbeitungen nach Art. 6 Abs. 1 lit. e oder f DSGVO, Widerruf von Einwilligungen mit Wirkung für die Zukunft, Beschwerde bei einer Aufsichtsbehörde (zuständig: Landesbeauftragte für Datenschutz und Informationsfreiheit Nordrhein-Westfalen).

## 10. Änderungen
Das Datum oben gibt den Stand an. Wesentliche Änderungen kündigen wir in der App an.`,
        en: `# Privacy Policy for the Drink With Me App
**Last updated: November 26, 2026**

This policy explains how personal data is processed when you use the mobile app **Drink With Me** (“the app”, “we”, “us”). The website has its own privacy policy.

## 1. Controller
**blocklevel GmbH**, Drahtzieherweg 15, 47877 Willich, Germany

Email: **datenschutz@blocklevel.de** · Phone: +49 (2154) 8912 - 800

## 2. Age
The app is for people aged 18 and over. We check your date of birth at sign-up; anyone under 18 cannot create an account.

## 3. What we process

### Account and sign-in
- Email address, user ID and the sign-in method (email with a one-time code, Apple or Google).
- Sign-in runs through **Microsoft Entra External ID**. With Apple or Google, that provider authenticates you and passes us what we need for your account. Apple “Hide My Email” addresses count as their own address.
- There is one account per email address. If you sign in with a second method and the same address, we do not link the accounts and point you to the first method.
- By registering you accept the terms of use; we store the accepted version.

### Profile
First name, date of birth (others see your age), up to three profile photos, a short bio (up to 140 characters), languages, your city and your preferences (what you are open for, drinks, places, privacy, notifications). Other people see your profile within the features of the app. Of your photos we store only re-encoded versions without metadata (such as the place a photo was taken); we do not keep the file you upload.

### Location
- With your permission (“while using the app”) we read your approximate location to show check-ins, rounds and meeting points nearby, to work out your area (for example the district) and to send “Let me know” alerts.
- **Strangers never see your coordinates, your bar or an address**, only the area and a map point on a grid of about 1.1 km. Friends see the bar of your check-in. After a mutual Cheers, both of you see the bar in the chat.
- To work out your area and to search for bars, our server sends coordinates and search terms to **Microsoft Azure Maps**.
- We store your last known position so that we can notify you about activity nearby (if you turned “Let me know” on).
- **Sharing a location in a chat:** If you choose “Share current location” in a chat, the chat members see your exact position once, as a line in the chat, and can open it in a maps app for one hour. After that we remove the coordinates from the chat. The position is not updated live; the app reads it only at the moment you confirm.

### Check-ins, rounds and meeting points
- **Check-in (“I’m out right now”):** drink, bar or area, who may see it (friends, selected friends, everyone), whether you are alone, optionally a drink photo and a note. A check-in ends after 3 hours (+1 hour on request) or when you end it. **We delete the drink photo as soon as the check-in ends.**
- **Rounds:** time, place (bar or radius), drink, seats, vibe, note, members, requests and your answer to the reminder on the day of the round.
- **Meeting points:** weekly dates at bars. We store whether you are “in”.

### Cheers, joining, friends
Cheers and cheers back (among friends also a Cheers for a planned round; the host sees which friends toasted), requests to join and their answers (with an estimated arrival time), friendships (created through an invite link or after a meeting where both say “yes, gladly”) and invite links.

### Chats
Messages (text, quick actions such as “On my way” and “I’m here”, a shared location), timestamps and read status, and reactions (one emoji per person and message, visible to everyone in the chat). System lines in a chat (for example “Lena is on the way”) show only what the people involved triggered themselves.

### After the meeting
The day after a meeting we ask “How was it?”. We store your answer (for example keep in touch, “did not meet” with a reason, “was not there”). **The other person never learns about a one-sided answer.** Two people become friends only if both say “yes, gladly”. Someone marked as not having shown up in several meetings sees their “showed up” value drop; single marks do not count. If you choose “Not okay”, we create a report that we review within 24 hours.

### Selfie verification
Selfie verification is **currently not active**. If you nevertheless take a selfie in the app, our server receives it, does not analyse it and does not store it; only the time of your consent is stored. Before we switch verification on, we will amend this policy.

### Safety
Blocking and reporting (reporting and reported person, reason, content concerned, action taken). Someone you block disappears from check-ins, rounds, Cheers and chats in both directions.

### Notifications
Device token for push (**Firebase Cloud Messaging** by Google or **Apple Push Notification Service**), your settings (friends out, Cheers, requests for your round; quiet hours) and delivery attempts. The lock screen never shows the bar, and for “someone toasts you” it does not name the sender. If you answer a “join” request straight from a notification, we use a one-time token valid for that request only.

### Technical data and crash reports
IP address, timestamps, device type, operating system, app version, error and security events. In release builds we use **Firebase Crashlytics** (crash reports, device model, installation IDs; stored for about 90 days according to Google). **We do not use Firebase Analytics.** We also send technical telemetry to our own infrastructure to detect errors and prevent abuse. We keep write requests for 30 days to prevent duplicate execution.

### Maps
We use **MapLibre**. We deliver the map styles through our website drink-with-me.net (hosting: **GitHub Pages** by GitHub, Inc., USA); the map tiles come from **OpenFreeMap** (Hyperknot Software Kft., Hungary; possibly with Cloudflare as CDN) and data from OpenStreetMap. Loading the map transmits the technically required connection data to GitHub and OpenFreeMap. According to OpenFreeMap it does not store IP addresses in regular logs; in case of abuse they may be logged for up to 30 days.

## 4. Purposes and legal bases
- **Contract (Art. 6(1)(b) GDPR):** account, profile, check-ins, rounds, Cheers, chats, friends, meeting points, notifications you use in the app.
- **Consent (Art. 6(1)(a) GDPR):** location, camera, notifications, sharing a location in a chat.
- **Legitimate interest (Art. 6(1)(f) GDPR):** security and stability, crash reports, abuse and fraud prevention, review of reports, rate limits, enforcing the rules.
- **Legal obligation (Art. 6(1)(c) GDPR)** where applicable.
We make no decisions based solely on automated processing that have legal effects on you (Art. 22 GDPR).

## 5. Access to your device
Camera and photos (profile photos, drink photo, selfie), location (“while using the app”, never in the background), notifications and local storage (language, appearance, sign-up progress) only as needed for the feature or as you allow (§ 25 TDDDG). You can revoke permissions at any time in your operating system settings.

## 6. Recipients and service providers
- **Microsoft:** Azure (hosting in the North Europe region), Entra External ID (sign-in), Azure Maps (place search and working out your area).
- **Google:** Firebase Cloud Messaging, Firebase Crashlytics; Sign in with Google.
- **Apple:** push service; Sign in with Apple.
- **GitHub:** delivery of the map styles.
- **OpenFreeMap / Cloudflare:** maps.
- **Other users:** only what the feature provides (profile, check-in, area, chats) and as you share it.
We do not sell data and do not use it for third-party advertising or cross-app tracking.

## 7. Third countries
We use providers based in the USA (Google, Apple, Microsoft, GitHub, Cloudflare) on the basis of the EU-US Data Privacy Framework or the European Commission’s Standard Contractual Clauses.

## 8. Retention
- **Drink photo:** deleted as soon as the check-in ends.
- **Shared location in a chat:** can be opened for one hour, after that the coordinates are removed from the chat line.
- **Write-request keys (idempotency):** 30 days.
- **Crash reports:** about 90 days (Google).
- **Everything else:** until you delete your account. On deletion we remove your profile, photos, check-ins, round participation, chats, Cheers, meetings, blocks, reports, device tokens, notifications and your sign-in account.
You can delete your account and export your data in the app under Settings → Account and at [drink-with-me.net/delete-account.html](delete-account.html).

## 9. Your rights
Access, rectification, erasure, restriction, data portability, objection to processing under Art. 6(1)(e) or (f) GDPR, withdrawal of consent with effect for the future, and a complaint to a supervisory authority (competent: the State Commissioner for Data Protection and Freedom of Information of North Rhine-Westphalia).

## 10. Changes
The date above shows the version. We announce material changes in the app.`

            applyLanguage(next);
            var params = new URLSearchParams(window.location.search);
            params.set('lang', next);
            history.replaceState(null, '', window.location.pathname + '?' + params.toString());
          }
        });
      });

      applyLanguage(resolveInitialLanguage());
    })();
  </script>
</body>
</html>
