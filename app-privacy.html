## 4. Standortdaten
Drink With Me verwendet Standortinformationen fur Funktionen, bei denen die raumliche Nahe relevant ist.

## 11. Crash-Reporting und technische Telemetrie
Wir verarbeiten technische Informationen, um die Sicherheit, Stabilitat und Zuverlassigkeit von Drink With Me zu gewahrleisten.

### Firebase Crashlytics
In Release-Versionen von Drink With Me verwenden wir **Firebase Crashlytics** von Google zur Erkennung und Analyse technischer Fehler und Absturze.

Crashlytics kann insbesondere folgende Informationen verarbeiten:

- Crash-Berichte;
- Stack Traces;
- Informationen uber den Zustand der App zum Zeitpunkt eines Absturzes;
- Geratemodell und technische Gerateinformationen;
- Informationen zum Betriebssystem;
- App-Version;
- Zeitstempel;
- Firebase-Installationskennungen;
- Crashlytics-Installationskennungen.
Crashlytics dient dazu, technische Probleme zu erkennen und die Stabilitat und Zuverlassigkeit von Drink With Me zu verbessern.

Nach Angaben von Google speichert Firebase Crashlytics Crash-Stack-Traces, zugehorige Kennungen und bestimmte weitere Crash-Informationen grundsatzlich fur etwa 90 Tage, bevor mit der Loschung aus produktiven Systemen und Sicherungssystemen begonnen wird.

Drink With Me verwendet derzeit **kein Firebase Analytics**.

### Technische Drink With Me Telemetrie
Drink With Me sendet ausserdem bestimmte technische Telemetriedaten direkt an unsere eigene Backend-Infrastruktur.

Hierzu konnen technische Ereignisse gehoren, die erforderlich sind, um:

- Fehler zu erkennen und zu diagnostizieren;
- die Zuverlassigkeit der App zu uberwachen;
- technische Probleme zu untersuchen;
- den Dienst gegen Missbrauch zu schutzen;
- festzustellen, ob wesentliche App-Funktionen ordnungsgemaess funktionieren.
Soweit technische Telemetriedaten einem Drink With Me Konto zugeordnet werden konnen, verwenden wir diese ausschliesslich zum Betrieb, Schutz, zur Fehleranalyse und zur Verbesserung des Dienstes und nicht fur Werbung durch Dritte.

### Informationen zur Nutzung von Funktionen

Wir verwenden diese Informationen, um zu verstehen, ob Funktionen wie vorgesehen arbeiten, und um die App und die Benutzerfreundlichkeit zu verbessern.

Diese Informationen werden nicht fur personalisierte Werbung durch Dritte oder appubergreifendes Werbetracking verwendet.

## 12. Karten
Drink With Me verwendet **MapLibre** zur Darstellung interaktiver Karten.

Kartenstile und Kartenkacheln werden uber **OpenFreeMap** bereitgestellt. OpenFreeMap wird von **Hyperknot Software Kft., Ungarn**, betrieben.

Die Karten verwenden geografische Daten von **OpenStreetMap** sowie Technologien bzw. Datenstrukturen auf Basis des **OpenMapTiles**-Schemas.

Wenn die App Kartenressourcen ladt, werden die technisch zur Bereitstellung notwendigen Verbindungsinformationen an OpenFreeMap ubertragen.

Nach eigenen Angaben speichert OpenFreeMap in seinen regularen Serverprotokollen keine IP-Adressen. OpenFreeMap verarbeitet anonymisierte technische Protokolldaten wie Client- bzw. Browserinformationen, Zeitstempel und Informationen zum Betriebssystem.

OpenFreeMap gibt an, dass im Fall von Sicherheitsvorfallen oder Missbrauch vorubergehend eine Protokollierung von IP-Adressen fur maximal 30 Tage aktiviert werden kann.

OpenFreeMap kann **Cloudflare** als Content Delivery Network einsetzen. In diesem Fall konnen technische Anfrageinformationen zusatzlich durch Cloudflare verarbeitet werden.

Die Kartenfunktionen werden genutzt, um Orte, Veranstaltungen, Aktivitaten und gegebenenfalls freiwillig von Nutzern freigegebene Standorte darzustellen.

          if (trimmed.startsWith('## ')) {
            flushParagraph();
            html.push('<h2>' + inlineFormatting(trimmed.slice(3)) + '</h2>');
            return;
          }

          if (trimmed.startsWith('# ')) {
            flushParagraph();
            html.push('<h1>' + inlineFormatting(trimmed.slice(2)) + '</h1>');
            return;
          }

          paragraph.push(trimmed);
        });

        flushParagraph();
        closeList();

        return html.join('');
      }

      function resolveInitialLanguage() {
        if (supported.indexOf(queryLang) >= 0) {
          return queryLang;
        }

        var stored = readStoredLanguage();
        if (supported.indexOf(stored) >= 0) {
          return stored;
        }

        var browser = detectBrowserLanguage();
        return supported.indexOf(browser) >= 0 ? browser : 'en';
      }

      function applyLanguage(lang) {
        var content = markdown[lang] || markdown.en;
        var ui = labels[lang] || labels.en;

        document.documentElement.lang = lang;
        document.title = ui.pageTitleTag;

        document.querySelectorAll('[data-i18n]').forEach(function (el) {
          var key = el.getAttribute('data-i18n');
          if (ui[key]) {
            el.textContent = ui[key];
          }
        });

        document.querySelectorAll('[data-set-lang]').forEach(function (button) {
          button.setAttribute('aria-pressed', button.getAttribute('data-set-lang') === lang ? 'true' : 'false');
        });

        var target = document.getElementById('policy-content');
        target.innerHTML = renderMarkdown(content);

        storeLanguage(lang);
      }

      document.querySelectorAll('[data-set-lang]').forEach(function (button) {
        button.addEventListener('click', function () {
          var next = button.getAttribute('data-set-lang');
          if (supported.indexOf(next) >= 0) {
            applyLanguage(next);
            var params = new URLSearchParams(window.location.search);
            params.set('lang', next);
            history.replaceState(null, '', window.location.pathname + '?' + params.toString());
          }
        });
      });

      applyLanguage(resolveInitialLanguage());
    })();
  </script>
</body>
</html>
