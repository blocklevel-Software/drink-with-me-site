      function detectBrowserLanguage() {
        var preferred = (navigator.languages && navigator.languages[0]) || navigator.language || 'en';
        return preferred.toLowerCase().startsWith('de') ? 'de' : 'en';
      }

      function readStoredLanguage() {
        try {
          var stored = localStorage.getItem(storageKey);
          return supported.indexOf(stored) >= 0 ? stored : null;
        } catch {
          return null;
        }
      }

      function storeLanguage(lang) {
        try {
          localStorage.setItem(storageKey, lang);
        } catch {
          // Ignore storage failures.
        }
      }

      function escapeHtml(text) {
        return text
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;');
      }

      function inlineFormatting(text) {
        return escapeHtml(text)
          .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
          .replace(/\[(.+?)\]\((.+?)\)/g, '<a href="$2">$1</a>');
      }

      function renderMarkdown(md) {
        var lines = md.split(/\r?\n/);
        var html = [];
        var inList = false;
        var paragraph = [];

        function flushParagraph() {
          if (paragraph.length) {
            html.push('<p>' + inlineFormatting(paragraph.join(' ')) + '</p>');
            paragraph = [];
          }
        }

        function closeList() {
          if (inList) {
            html.push('</ul>');
            inList = false;
          }
        }

        lines.forEach(function (line) {
          var trimmed = line.trim();

          if (!trimmed) {
            flushParagraph();
            closeList();
            return;
          }

          if (trimmed.startsWith('- ')) {
            flushParagraph();
            if (!inList) {
              html.push('<ul>');
              inList = true;
            }
            html.push('<li>' + inlineFormatting(trimmed.slice(2)) + '</li>');
            return;
          }

          closeList();

          if (trimmed.startsWith('### ')) {
            flushParagraph();
            html.push('<h3>' + inlineFormatting(trimmed.slice(4)) + '</h3>');
            return;
          }

          if (trimmed.startsWith('## ')) {
            flushParagraph();
            html.push('<h2>' + inlineFormatting(trimmed.slice(3)) + '</h2>');
            return;
          }

          if (trimmed.startsWith('# ')) {
            flushParagraph();
            html.push('<h1>' + inlineFormatting(trimmed.slice(2)) + '</h1>');
            return;
          }

          paragraph.push(trimmed);
        });

        flushParagraph();
        closeList();

        return html.join('');
      }

      function resolveInitialLanguage() {
        if (supported.indexOf(queryLang) >= 0) {
          return queryLang;
        }

        var stored = readStoredLanguage();
        if (supported.indexOf(stored) >= 0) {
          return stored;
        }

        var browser = detectBrowserLanguage();
        return supported.indexOf(browser) >= 0 ? browser : 'en';
      }

      function applyLanguage(lang) {
        var content = markdown[lang] || markdown.en;
        var ui = labels[lang] || labels.en;

        document.documentElement.lang = lang;
        document.title = ui.pageTitleTag;

        document.querySelectorAll('[data-i18n]').forEach(function (el) {
          var key = el.getAttribute('data-i18n');
          if (ui[key]) {
            el.textContent = ui[key];
          }
        });

        document.querySelectorAll('[data-set-lang]').forEach(function (button) {
          button.setAttribute('aria-pressed', button.getAttribute('data-set-lang') === lang ? 'true' : 'false');
        });

        var target = document.getElementById('terms-content');
        target.innerHTML = renderMarkdown(content);

        storeLanguage(lang);
      }

      document.querySelectorAll('[data-set-lang]').forEach(function (button) {
        button.addEventListener('click', function () {
          var next = button.getAttribute('data-set-lang');
          if (supported.indexOf(next) >= 0) {
            applyLanguage(next);
            var params = new URLSearchParams(window.location.search);
            params.set('lang', next);
            history.replaceState(null, '', window.location.pathname + '?' + params.toString());
          }
        });
      });

      applyLanguage(resolveInitialLanguage());
    })();
